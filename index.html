<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login">
        <h1>Welcome Back</h1>
        <p>Login to your account</p>

        <form id="loginForm">
            <div class="email-box">
              <input type="email" id="email" list="emailList" placeholder="Email address" autocomplete="email" required>
                <datalist id="emailList">
                    <option value="jacob@gmail.com">
                    <option value="maria@gmail.com">
                </datalist>
                <img class="icon-right no-click" src="https://cdn.jsdelivr.net/npm/lucide-static@0.452.0/icons/mail.svg" alt="email icon">
            </div>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password" required>
                <img class="icon-right" id="eyeIcon" src="https://cdn.jsdelivr.net/npm/lucide-static@0.452.0/icons/eye.svg" alt="show password">
            </div>

            <p id="errorMsg"></p>

            <button type="submit">Login</button>
        </form>

        <a href="#">Forgot password?</a>

        <span>Don't have an account? <a href="signup.html" class="inline-link">Sign Up</a></span>
    </div>

    <footer>All rights reserved. Jacob 2026</footer>

    <script src="script.js"></script>
</body>
</html>
