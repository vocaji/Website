<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login">
        <h1>Create Account</h1>
        <p>Sign up to get started</p>

        <form id="signupForm">
            <div class="email-box">
                <img class="icon-right no-click" src="https://cdn.jsdelivr.net/npm/lucide-static@0.452.0/icons/mail.svg" alt="email icon">
                <input type="email" id="email" placeholder="Email address" required>
            </div>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password" required>
                <img class="icon-right" id="eyeIcon" src="https://cdn.jsdelivr.net/npm/lucide-static@0.452.0/icons/eye.svg" alt="show password">
            </div>

            <div class="password-box">
                <input type="password" id="confirm" placeholder="Confirm password" required>
                <img class="icon-right" id="confirmEye" src="https://cdn.jsdelivr.net/npm/lucide-static@0.452.0/icons/eye.svg" alt="show confirm password">
            </div>

            <p id="msg"></p>

            <button type="submit">Sign Up</button>
        </form>

        <span>Already have an account? <a href="index.html" class="inline-link">Login</a></span>
    </div>

    <footer>All rights reserved. Jacob 2026</footer>

    <script src="signup.js"></script>
</body>
</html>
